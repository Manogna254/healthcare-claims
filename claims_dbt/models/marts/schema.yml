version: 2

models:
  - name: dim_patients
    columns:
      - name: patient_id
        tests:
          - unique
          - not_null

  - name: fct_claims
    columns:
      - name: claim_id
        tests:
          - unique
          - not_null
      - name: patient_id
        tests:
          - not_null
      - name: total_amount
        tests:
          - not_null:
              config:
                where: "claim_type = 'Claim'"